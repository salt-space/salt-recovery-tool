[workspace]
resolver = "2"
members = ["crates/core", "src-tauri"]

[workspace.package]
version = "0.2.3"
edition = "2021"
rust-version = "1.90"
license = "MIT"
publish = false

[workspace.dependencies]
salt-recovery-core = { path = "crates/core" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
zeroize = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true
