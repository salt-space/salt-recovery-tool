name: Build desktop apps

# External PRs and comments must never trigger CI. The repository Actions
# event policy in actions-policy.json must also be applied by an administrator.
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

# github.workflow is the caller's name under workflow_call, so a release build
# never cancels (or is cancelled by) a push build on the same branch.
# Do not cancel a called release build: a second click would drop a half-done cut.
concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  build:
    if: >-
      github.repository == 'salt-space/salt-recovery-tool' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: linux-x64
          - os: macos-latest
            target: macos-universal
          - os: windows-latest
            target: win-x64

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install Tauri Linux prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libwebkit2gtk-4.1-dev libgtk-3-dev \
            librsvg2-dev libayatana-appindicator3-dev libxdo-dev patchelf \
            rpm file libfuse2

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Add macOS universal Rust targets
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      - name: Install JS dependencies
        run: npm ci

      - name: Typecheck and test
        run: |
          npm run typecheck
          cargo test --locked -p salt-recovery-core -p salt-recovery-tool

      - name: Build desktop app (GUI + headless CLI in one binary)
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            # Intel + Apple Silicon fat binary (lipo), then .app / .dmg
            npm run tauri -- build --target universal-apple-darwin -- --locked
          else
            npm run tauri -- build -- --locked
          fi

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p artifacts
          if [ "$RUNNER_OS" = "macOS" ]; then
            release_dir=target/universal-apple-darwin/release
          else
            release_dir=target/release
          fi
          # Portable app binary (also the headless CLI: salt-recovery-tool reconstruct …).
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp "$release_dir/salt-recovery-tool.exe" artifacts/
          else
            cp "$release_dir/salt-recovery-tool" artifacts/
          fi
          find "$release_dir/bundle" -type f \
            \( -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' -o -name '*.dmg' \
               -o -name '*.msi' -o -name '*-setup.exe' \) \
            -exec cp {} artifacts/ \;
          ls -la artifacts

      - uses: actions/upload-artifact@v6
        with:
          name: salt-recovery-tool-${{ matrix.target }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 30
